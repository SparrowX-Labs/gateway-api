name: Argo CD sync template

on:
  workflow_call:
    inputs:
      app-name:
        description: Argo CD application name
        required: true
        type: string
      environment:
        description: Deployment environment
        required: true
        type: string
    secrets:
      ARGOCD_SERVER:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync ${{ inputs.app-name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Verify Argo CD access
        uses: clowdhaus/argo-cd-action@v4.2.0
        with:
          version: 2.14.11
          command: app get ${{ inputs.app-name }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Sync application
        uses: clowdhaus/argo-cd-action@v4.2.0
        with:
          version: 2.14.11
          command: app sync ${{ inputs.app-name }}
          options: >-
            --server ${{ secrets.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --timeout 600
