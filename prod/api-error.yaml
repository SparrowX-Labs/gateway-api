apis:
  api-error:
    routeName: api-error
    path: /api
    hostname: sparrowx.prod.mo2cloud.com
    backendService: web-portal
    servicePort: 80
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          add:
            - name: X-SparrowX-API-Error
              value: "true"
